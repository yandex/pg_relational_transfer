services:

  source-db:
    image: postgres:16
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=${DB_SOURCE_PASSWORD}
      - POSTGRES_USER=${DB_SOURCE_USERNAME}
      - POSTGRES_DB=${DB_SOURCE_NAME}
      - POSTGRES_PORT=${DB_SOURCE_PORT}
    ports:
      - "${DB_SOURCE_PORT}:5432"
    volumes:
      - source-db:/var/lib/postgresql/data

  target-db:
    image: postgres:16
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=${DB_TARGET_PASSWORD}
      - POSTGRES_USER=${DB_TARGET_USERNAME}
      - POSTGRES_DB=${DB_TARGET_NAME}
      - POSTGRES_PORT=${DB_TARGET_PORT}
    ports:
      - "${DB_TARGET_PORT}:5432"

  test-db:
    image: postgres:16
    profiles: [test]
    command: ["postgres", "-p", "${TEST_DB_PORT:-55432}"]
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:${TEST_DB_PORT:-55432}"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -p ${TEST_DB_PORT:-55432}"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  source-db:
    driver: local
